services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentloop
      POSTGRES_PASSWORD: agentloop
      POSTGRES_DB: agentloop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentloop"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      AGENTLOOP_DATABASE_URL: postgresql+psycopg://agentloop:agentloop@db:5432/agentloop
      AGENTLOOP_JWT_SECRET: ${AGENTLOOP_JWT_SECRET:-change-me-to-a-long-random-string-before-deploying}
      AGENTLOOP_LLM_PROVIDER: ${AGENTLOOP_LLM_PROVIDER:-mock}
      AGENTLOOP_LLM_PRESET: ${AGENTLOOP_LLM_PRESET:-}
      AGENTLOOP_LLM_API_KEY: ${AGENTLOOP_LLM_API_KEY:-}
      AGENTLOOP_LLM_MODEL_STRONG: ${AGENTLOOP_LLM_MODEL_STRONG:-mock-strong}
      AGENTLOOP_LLM_MODEL_FAST: ${AGENTLOOP_LLM_MODEL_FAST:-mock-fast}
      AGENTLOOP_MOCK_STREAM_DELAY: "0.02"
      AGENTLOOP_CORS_ORIGINS: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
