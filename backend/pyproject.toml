[project]
name = "loopdesk"
version = "1.0.0"
description = "An evidence-first, self-improving customer service agent platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
anthropic = ["anthropic>=0.70"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::SyntaxWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
